<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Yoyi 的压岁钱小账本</title>

  <!-- Optional: upload icon.png to same folder -->
  <link rel="apple-touch-icon" sizes="180x180" href="icon.png">
  <link rel="icon" href="icon.png">

  <style>
    :root{
      --bg:#f4f6fb;
      --card:#ffffff;
      --text:#0b1220;
      --muted:#667085;
      --line:#e7eaf1;
      --shadow: 0 10px 30px rgba(15, 23, 42, .08);
      --primary:#111827;
      --danger:#d92d20;
      --ok:#16a34a;
      --pill:#eef2ff;
      --radius:22px;
      --btnRadius:16px;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      background:linear-gradient(180deg, #f7f9ff 0%, var(--bg) 55%, var(--bg) 100%);
      color:var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei", system-ui, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }

    .wrap{
      max-width: 820px; /* a bit wider for desktop/iPad */
      margin: 0 auto;
      padding: 18px 16px 44px;
    }

    .title{
      display:flex;
      align-items:flex-start;
      gap:10px;
      padding-top: 6px;
    }
    .title h1{
      margin: 4px 0 4px;
      font-size: 30px;
      line-height: 1.1;
      letter-spacing: .2px;
    }
    .subtitle{
      color:var(--muted);
      font-size: 14px;
      line-height: 1.45;
      margin-top: 6px;
    }

    .card{
      background:var(--card);
      border:1px solid rgba(231,234,241,.9);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    /* NEW: balances as 3 blocks */
    .balGrid{
      margin-top: 14px;
      display:grid;
      gap: 12px;
      grid-template-columns: 1fr; /* mobile */
    }
    @media (min-width: 720px){
      .balGrid{ grid-template-columns: repeat(3, 1fr); }
    }
    .balBox{
      padding: 14px 14px 12px;
    }
    .balTop{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight: 900;
      letter-spacing:.2px;
    }
    .balPill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(17,24,39,.06);
      border: 1px solid rgba(17,24,39,.10);
      font-size: 13px;
      font-weight: 900;
    }
    .balBig{
      margin-top: 8px;
      font-size: 38px;
      font-weight: 1000;
      line-height: 1;
      letter-spacing:.2px;
    }
    .balBig .yen{
      font-size: 18px;
      margin-left: 4px;
      color: var(--muted);
      font-weight: 900;
    }
    .balDesc{
      margin-top: 8px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.45;
    }

    .section{
      margin-top: 16px;
      padding: 16px;
    }
    .section h2{
      margin: 0 0 12px;
      font-size: 22px;
      letter-spacing: .2px;
    }

    label{
      display:block;
      font-size: 13px;
      color: var(--muted);
      margin: 10px 0 6px;
    }

    .grid{
      display:grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    /* IMPORTANT: prevent overflow in iPad/Safari grid */
    .grid > div,
    .row2 > div{ min-width: 0; }

    select,input,textarea{
      width:100%;
      min-width:0;              /* prevent grid overflow */
      max-width:100%;           /* prevent border spilling */
      font-size:16px;
      padding: 12px 14px;
      border-radius: 14px;
      border:1px solid var(--line);
      background:#fff;
      outline:none;
    }
    input[type="date"]{
      -webkit-appearance: none;
      appearance: none;
      background-clip: padding-box;
    }
    textarea{ min-height: 46px; resize: vertical; }

    .row2{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btnRow{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top: 12px;
    }
    button{
      border:1px solid transparent;
      background:#fff;
      padding: 12px 14px;
      border-radius: var(--btnRadius);
      font-size: 16px;
      cursor:pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .primary{
      background: var(--primary);
      color:#fff;
    }
    .ghost{
      background:#fff;
      border-color: var(--line);
      color: var(--text);
    }
    .danger{
      background:#fff;
      border-color: rgba(217,45,32,.35);
      color: var(--danger);
    }
    .dangerFill{
      background: rgba(217,45,32,.07);
      border-color: rgba(217,45,32,.25);
      color: var(--danger);
    }
    .small{
      padding: 10px 12px;
      font-size: 15px;
      border-radius: 14px;
    }

    .hint{
      font-size: 14px;
      color: var(--muted);
      line-height: 1.5;
      margin: 8px 0 0;
    }

    .listWrap{
      margin-top: 8px;
    }

    .empty{
      text-align:center;
      color: var(--muted);
      font-size: 14px;
      padding: 22px 0 10px;
    }

    .txCard{
      border:1px solid var(--line);
      background:#fff;
      border-radius: 18px;
      padding: 14px 14px;
      margin-top: 12px;
    }
    .txTop{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:flex-start;
    }
    .txTitle{
      font-size: 22px;
      font-weight: 900;
      letter-spacing:.2px;
      line-height: 1.25;
    }
    .txAmt{
      font-size: 26px;
      font-weight: 900;
      white-space:nowrap;
    }
    .amtPlus{ color: var(--ok); }
    .amtMinus{ color: var(--danger); }

    .txMeta{
      margin-top: 6px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      color: var(--muted);
      font-size: 14px;
      align-items:center;
    }
    .pill{
      background: var(--pill);
      border: 1px solid rgba(99,102,241,.18);
      color: #3b3f98;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
    }
    .txBtns{
      margin-top: 10px;
      display:flex;
      justify-content:flex-end;
      gap:10px;
    }

    .footerTag{
      margin: 20px auto 0;
      width: fit-content;
      padding: 8px 14px;
      background: rgba(255,255,255,.75);
      border:1px solid rgba(231,234,241,.9);
      border-radius: 999px;
      color: rgba(11,18,32,.65);
      font-weight: 700;
      font-size: 14px;
    }

    @media (max-width: 420px){
      .row2{ grid-template-columns: 1fr; }
      .txTitle{ font-size: 20px; }
      .txAmt{ font-size: 24px; }
      .balBig{ font-size: 34px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="title">
      <div style="font-size:28px; line-height:1; margin-top:6px;">🧸</div>
      <div>
        <h1>Yoyi 的压岁钱小账本</h1>
        <div class="subtitle">
          三账户： 💰 Save（未来）｜🎁 Wish（愿望）｜❤️ Give（帮助）<br/>
          数据保存在本机浏览器（建议偶尔导出 CSV 备份）
        </div>
      </div>
    </div>

    <!-- NEW balances layout -->
    <div class="balGrid">
      <div class="card balBox">
        <div class="balTop"><span class="balPill">💰 SAVE 储蓄</span></div>
        <div class="balBig">¥<span id="balSave">0</span><span class="yen"></span></div>
        <div class="balDesc">给未来的你（初中后再讨论用途也 OK）</div>
      </div>

      <div class="card balBox">
        <div class="balTop"><span class="balPill">🎁 WISH 愿望</span></div>
        <div class="balBig">¥<span id="balWish">0</span><span class="yen"></span></div>
        <div class="balDesc">大愿望/礼物：可以和父母一起出</div>
      </div>

      <div class="card balBox">
        <div class="balTop"><span class="balPill">❤️ GIVE 帮助</span></div>
        <div class="balBig">¥<span id="balGive">0</span><span class="yen"></span></div>
        <div class="balDesc">捐赠/帮助他人：可以父母配比</div>
      </div>
    </div>

    <div class="card section">
      <h2>✍️ 添加 / 修改一笔记录</h2>

      <div class="grid">
        <div class="row2">
          <div>
            <label>账户</label>
            <select id="acct">
              <option value="save">Save（储蓄）</option>
              <option value="wish">Wish（愿望）</option>
              <option value="give">Give（帮助）</option>
            </select>
          </div>
          <div>
            <label>类型</label>
            <select id="type">
              <option value="in">+ 存入</option>
              <option value="out">− 支出</option>
            </select>
          </div>
        </div>

        <div class="row2">
          <div>
            <label>金额（HKD）</label>
            <input id="amount" inputmode="numeric" placeholder="例如 20000" />
          </div>
          <div>
            <label>日期</label>
            <input id="date" type="date" />
          </div>
        </div>

        <div class="row2">
          <div>
            <label>分类（可选）</label>
            <select id="cat">
              <option value="">（不选也可以）</option>
              <option value="gift">礼物</option>
              <option value="toy">玩具/乐高</option>
              <option value="trip">旅行/纪念品</option>
              <option value="donation">捐赠/帮助</option>
              <option value="snack">零食/小吃</option>
              <option value="stationery">文具</option>
              <option value="other">其他</option>
            </select>
          </div>
          <div>
            <label>备注（可选）</label>
            <input id="note" placeholder="例如：学校捐款 / 生日礼物 / 乐高出资" />
          </div>
        </div>

        <div class="btnRow">
          <button class="primary" id="saveBtn">保存这一笔</button>
          <button class="ghost" id="clearBtn">清空输入</button>
          <button class="ghost" id="exportBtn">导出CSV</button>
          <button class="dangerFill" id="resetBtn">清空所有数据（谨慎）</button>
        </div>

        <div class="hint" id="modeHint">小技巧：想改一笔，点下面记录右侧“编辑”。</div>
      </div>
    </div>

    <div class="card section">
      <h2>📒 记录列表（最新在上面）</h2>
      <div class="hint">这里只管压岁钱三账户即可（零花钱可另记或不记）。</div>
      <div class="listWrap" id="list"></div>
      <div class="footerTag">sisiliang07.github.io</div>
    </div>
  </div>

<script>
(function(){
  const KEY = "yoyi_money_tracker_v1_cards";
  const el = id => document.getElementById(id);

  const acctEmoji = a => ({save:"💰", wish:"🎁", give:"❤️"}[a] || "💼");
  const acctName  = a => ({save:"Save", wish:"Wish", give:"Give"}[a] || a);
  const catName = c => ({
    "":"—",
    "gift":"礼物",
    "toy":"玩具/乐高",
    "trip":"旅行/纪念品",
    "donation":"捐赠/帮助",
    "snack":"零食/小吃",
    "stationery":"文具",
    "other":"其他"
  }[c] || c);

  const todayISO = () => {
    const d = new Date();
    const tz = d.getTimezoneOffset()*60000;
    return new Date(Date.now()-tz).toISOString().slice(0,10);
  };

  function load(){
    try{
      const raw = localStorage.getItem(KEY);
      if(!raw) return { tx: [] };
      const data = JSON.parse(raw);
      if(!data || !Array.isArray(data.tx)) return { tx: [] };
      return data;
    }catch(e){
      return { tx: [] };
    }
  }

  function save(data){
    localStorage.setItem(KEY, JSON.stringify(data));
  }

  function yen(n){
    const x = Number(n)||0;
    return x.toLocaleString("ja-JP");
  }

  function computeBalances(tx){
    const bal = {save:0, wish:0, give:0};
    tx.forEach(t=>{
      const amt = Number(t.amount)||0;
      if(!bal.hasOwnProperty(t.acct)) return;
      bal[t.acct] += (t.type === "in" ? amt : -amt);
    });
    return bal;
  }

  function setBalances(){
    const data = load();
    const bal = computeBalances(data.tx);
    el("balSave").textContent = yen(bal.save);
    el("balWish").textContent = yen(bal.wish);
    el("balGive").textContent = yen(bal.give);
  }

  let editingId = null;

  function clearForm(){
    editingId = null;
    el("acct").value = "save";
    el("type").value = "in";
    el("amount").value = "";
    el("date").value = todayISO();
    el("cat").value = "";
    el("note").value = "";
    el("saveBtn").textContent = "保存这一笔";
    el("modeHint").textContent = "小技巧：想改一笔，点下面记录右侧“编辑”。";
  }

  function validateAmount(){
    const raw = (el("amount").value || "").replace(/[,\s]/g,"");
    if(raw === "") return {ok:false, msg:"请输入金额。"};
    const amt = Number(raw);
    if(!Number.isFinite(amt) || amt <= 0) return {ok:false, msg:"金额要是大于 0 的数字。"};
    return {ok:true, amt: Math.floor(amt)};
  }

  function canAfford(acct, outAmt, data, ignoreId){
    const tx = data.tx.filter(t=> t.id !== ignoreId);
    const bal = computeBalances(tx)[acct] || 0;
    return bal - outAmt >= 0;
  }

  function addOrUpdate(){
    const data = load();
    const acct = el("acct").value;
    const type = el("type").value;
    const date = el("date").value || todayISO();
    const cat  = el("cat").value || "";
    const note = (el("note").value || "").trim();

    const v = validateAmount();
    if(!v.ok){ alert(v.msg); return; }
    const amount = v.amt;

    if(type === "out"){
      const ok = canAfford(acct, amount, data, editingId);
      if(!ok){
        alert("这个账户余额不足，不能支出这么多。");
        return;
      }
    }

    if(editingId){
      const idx = data.tx.findIndex(t=>t.id===editingId);
      if(idx >= 0){
        data.tx[idx] = { ...data.tx[idx], acct, type, amount, date, cat, note };
      }
      editingId = null;
    }else{
      const id = String(Date.now()) + "_" + Math.random().toString(16).slice(2);
      data.tx.push({ id, acct, type, amount, date, cat, note });
    }

    data.tx.sort((a,b)=>{
      if(a.date !== b.date) return a.date < b.date ? 1 : -1;
      return a.id < b.id ? 1 : -1;
    });

    save(data);
    clearForm();
    render();
  }

  function startEdit(id){
    const data = load();
    const t = data.tx.find(x=>x.id===id);
    if(!t) return;
    editingId = id;
    el("acct").value = t.acct;
    el("type").value = t.type;
    el("amount").value = String(t.amount);
    el("date").value = t.date || todayISO();
    el("cat").value = t.cat || "";
    el("note").value = t.note || "";
    el("saveBtn").textContent = "保存修改";
    el("modeHint").textContent = "正在编辑：改完后点“保存修改”。想取消就点“清空输入”。";
    window.scrollTo({top:0, behavior:"smooth"});
  }

  function delTx(id){
    const data = load();
    const t = data.tx.find(x=>x.id===id);
    if(!t) return;
    if(!confirm("确定删除这条记录吗？")) return;
    data.tx = data.tx.filter(x=>x.id!==id);
    save(data);
    if(editingId === id) clearForm();
    render();
  }

  function renderList(){
    const data = load();
    const list = el("list");
    list.innerHTML = "";

    if(data.tx.length === 0){
      const d = document.createElement("div");
      d.className = "empty";
      d.textContent = "还没有记录。可以先把今年的压岁钱分配存入三账户。";
      list.appendChild(d);
      return;
    }

    data.tx.forEach(t=>{
      const isOut = t.type === "out";
      const sign = isOut ? "-" : "+";
      const amtClass = isOut ? "amtMinus" : "amtPlus";

      const card = document.createElement("div");
      card.className = "txCard";

      const top = document.createElement("div");
      top.className = "txTop";

      const title = document.createElement("div");
      title.className = "txTitle";
      title.textContent = `${t.date} · ${acctEmoji(t.acct)} ${acctName(t.acct)}`;

      const amt = document.createElement("div");
      amt.className = "txAmt " + amtClass;
      amt.textContent = `${sign}¥${yen(t.amount)}`;

      top.appendChild(title);
      top.appendChild(amt);

      const meta = document.createElement("div");
      meta.className = "txMeta";

      const typeSpan = document.createElement("span");
      typeSpan.textContent = (isOut ? "− 支出" : "+ 存入");
      meta.appendChild(typeSpan);

      const catSpan = document.createElement("span");
      catSpan.className = "pill";
      catSpan.textContent = catName(t.cat || "");
      meta.appendChild(catSpan);

      if(t.note){
        const noteSpan = document.createElement("span");
        noteSpan.textContent = "· " + t.note;
        meta.appendChild(noteSpan);
      }

      const btns = document.createElement("div");
      btns.className = "txBtns";

      const editBtn = document.createElement("button");
      editBtn.className = "ghost small";
      editBtn.textContent = "编辑";
      editBtn.onclick = ()=> startEdit(t.id);

      const delBtn = document.createElement("button");
      delBtn.className = "danger small";
      delBtn.textContent = "删除";
      delBtn.onclick = ()=> delTx(t.id);

      btns.appendChild(editBtn);
      btns.appendChild(delBtn);

      card.appendChild(top);
      card.appendChild(meta);
      card.appendChild(btns);

      list.appendChild(card);
    });
  }

  function render(){
    setBalances();
    renderList();
  }

  function exportCSV(){
    const data = load();
    const rows = [["date","account","type","amount_jpy","category","note"]];
    data.tx.forEach(t=>{
      rows.push([t.date, acctName(t.acct), t.type, t.amount, catName(t.cat||""), t.note||""]);
    });
    const csv = rows.map(r => r.map(x => `"${String(x).replace(/"/g,'""')}"`).join(",")).join("\n");
    const blob = new Blob([csv], {type:"text/csv;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "yoyi_money_tracker.csv";
    a.click();
    URL.revokeObjectURL(url);
  }

  function resetAll(){
    if(!confirm("确定要清空所有数据吗？此操作不可恢复。")) return;
    localStorage.removeItem(KEY);
    clearForm();
    render();
  }

  el("saveBtn").addEventListener("click", addOrUpdate);
  el("clearBtn").addEventListener("click", clearForm);
  el("exportBtn").addEventListener("click", exportCSV);
  el("resetBtn").addEventListener("click", resetAll);

  el("date").value = todayISO();
  render();
})();
</script>
</body>
</html>
